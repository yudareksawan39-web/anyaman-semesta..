<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101f35"><link rel="icon" type="image/png" href="assets/icon-aplikasi.png"><link rel="apple-touch-icon" href="assets/icon-aplikasi.png"><meta name="description" content="Anyaman Semesta — Menyibak Simetri dan Tauhid dalam Batik Sulawesi Selatan">
  <title>Anyaman Semesta — Menyibak Simetri dan Tauhid</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <section id="splash" class="splash">
    <img class="cover-art" src="assets/sampul-anyaman-semesta.jpg" alt="Sampul Anyaman Semesta dengan pemandangan pesisir Sulawesi Selatan">
    <div class="splash-shade"></div><div class="splash-content">
      <img class="splash-logo" src="assets/logo-anyaman-semesta.jpeg" alt="Logo Anyaman Semesta"><div class="splash-label">MATEMATIKA · BUDAYA · ISLAM</div>
      <p class="splash-quote">“Setiap pola adalah bahasa, setiap garis adalah doa.”</p>
      <button id="startBtn" class="btn btn-gold btn-large">Mulai Menjelajah <span>↗</span></button>
    </div>
  </section>
  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Buka menu opsi" aria-expanded="false">⚙️</button>
      <button id="musicLogoBtn" class="music-logo-btn" type="button" aria-label="Putar musik Anyaman Semesta" aria-pressed="false" title="Tekan untuk memutar atau menghentikan lagu"><img src="assets/logo-anyaman-semesta.jpeg" alt="Logo Anyaman Semesta"><span class="music-indicator" aria-hidden="true">♫</span></button>
      <button class="brand" data-page="home"><span class="brand-flower">✺</span><span><b>Anyaman Semesta</b><small>Menyibak Simetri dan Tauhid</small></span></button>
      <div class="top-actions"><span id="themeBadge" class="icon-btn theme-badge" title="Mode gelap permanen" aria-label="Mode gelap permanen">☾</span><button id="homeBtn" class="icon-btn" title="Beranda" aria-label="Beranda">⌂</button></div>
    </header>
    <div id="scrim" class="scrim"></div>
    <aside id="drawer" class="drawer"><div class="drawer-head"><span>✺</span><div><b>Jelajahi Semesta</b><small>Belajar · Menjelajah · Bermakna</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-page="home"><i>⌂</i>Beranda</button>
        <button class="nav-item" data-page="materi"><i>▤</i>Ruang Belajar <em>6 bab</em></button>
        <button class="nav-item" data-page="galeri"><i>❋</i>Galeri Motif</button>
        <button class="nav-item" data-page="studio"><i>✎</i>Studio Kreasi</button>
        <button class="nav-item" data-page="games"><i>🎮</i>Game</button>
        <div class="nav-divider"></div>
        <button class="nav-item" data-page="glosarium"><i>⌕</i>Glosarium</button>
        <button class="nav-item" data-page="referensi"><i>▧</i>Referensi</button>
        <button class="nav-item" data-page="tentang"><i>ⓘ</i>Tentang Aplikasi</button>
      </nav><div class="drawer-foot">Satu motif, banyak makna. Satu pola, banyak penemuan.</div>
    </aside>
    <main id="main" class="main">
      <section class="page active" id="page-home"></section><section class="page" id="page-materi"></section>
      <section class="page" id="page-galeri"></section><section class="page" id="page-studio"></section>
      <section class="page" id="page-games"></section>
      <section class="page" id="page-glosarium"></section><section class="page" id="page-referensi"></section><section class="page" id="page-tentang"></section>
      <footer class="footer">ANYAMAN SEMESTA <span>✦</span> Matematika × Budaya × Islam<br><small>Belajar · Menjelajah · Bermakna</small></footer>
    </main>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-backdrop" data-close-modal></div><article class="modal-card"><button class="modal-close" data-close-modal aria-label="Tutup">×</button><div id="modalBody"></div></article></div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <audio id="appMusic" src="assets/lagu-pengguna.mp3" preload="metadata" loop></audio>
  <script src="script.js"></script>
</body></html>
